<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#020617"/>
      <stop offset="50%" stop-color="#061426"/>
      <stop offset="100%" stop-color="#01040f"/>
    </linearGradient>

    <!-- Border Gradient -->
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#06b6d4"/>
      <stop offset="100%" stop-color="#3b82f6"/>
    </linearGradient>

    <!-- Text Gradient -->
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="40%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#06b6d4"/>
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="cyanGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Ambient Glow Behind Icon -->
  <rect x="36" y="36" width="440" height="440" rx="120" fill="#06b6d4" opacity="0.18" filter="url(#cyanGlow)"/>

  <!-- Main Squircle Body -->
  <rect x="40" y="40" width="432" height="432" rx="110" fill="url(#bgGrad)" stroke="url(#borderGrad)" stroke-width="16"/>

  <!-- Inner Subtle Border -->
  <rect x="58" y="58" width="396" height="396" rx="94" fill="none" stroke="#38bdf8" stroke-width="2" opacity="0.3"/>

  <!-- Monogram SK Typography -->
  <text x="236" y="324"
        font-family="'Plus Jakarta Sans', -apple-system, sans-serif"
        font-size="210"
        font-weight="900"
        letter-spacing="-12"
        fill="url(#textGrad)"
        text-anchor="middle">
    SK
  </text>

  <!-- Quantum Pulse Status Dot -->
  <circle cx="390" cy="122" r="22" fill="#22d3ee" filter="url(#cyanGlow)"/>
  <circle cx="390" cy="122" r="14" fill="#ffffff"/>
</svg>
